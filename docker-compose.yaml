version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doceum-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-doceum}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - doceum-network

  redis:
    image: redis:7-alpine
    container_name: doceum-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - doceum-network

  backend:
    build: ./backend
    container_name: doceum-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-doceum}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://doceum.ru,https://www.doceum.ru}
      STORAGE_ROOT: ${STORAGE_ROOT}
      DOCEO_SIGNING_SECRET: ${DOCEO_SIGNING_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - storage_data:${STORAGE_ROOT}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - doceum-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: doceum-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - doceum-network

networks:
  doceum-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data: