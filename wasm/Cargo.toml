[package]
name    = "doceo-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM bindings
wasm-bindgen       = "0.2"
serde-wasm-bindgen = "0.6"
js-sys             = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ZIP archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# Cryptography (signature verification)
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
hex  = "0.4"

# Error handling
thiserror = "1"

[profile.release]
opt-level = "z"
lto       = true