spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=testSecretKeyForJWTThatMustBeAtLeast32Chars
jwt.access-token-ttl-ms=900000

doceum.signing.secret=testSigningSecretKey

storage.root=./test-storage
storage.drafts=drafts
storage.publications=publications